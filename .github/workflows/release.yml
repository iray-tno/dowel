# Publishes everything: the nine `@hozo/*` packages, plus one package per
# platform carrying the native binding.
#
# Triggered by a tag, and only by a tag. `version.yml` keeps a "Version
# Packages" pull request open; merging it bumps nine versions and writes
# nine changelogs on `main` but publishes nothing. Pushing `v0.2.0` is the
# separate, deliberate act that uploads. npm allows unpublishing for 72
# hours and only while nothing depends on the package, so the step worth
# making explicit is this one.
#
# The shape is napi-rs's, without its CLI: a package per platform declaring
# `os`/`cpu`/`libc`, all of them optional dependencies of the real package,
# so npm installs the single one this machine can run and skips the rest.
# `packages/compiler/src/native-targets.ts` is the list, and a test in that
# package checks it against what the runtime loader asks for -- the two are
# independent derivations of one fact and a disagreement only shows up on
# the platform nobody develops on.
#
# NOT YET RUN. This was written on a machine that can build exactly one of
# these eight targets and has no way to execute a GitHub Actions workflow,
# so it is a design that compiles in principle. The first real run should
# be expected to need corrections -- most likely the musl and cross-arch
# jobs, which are the ones with a toolchain step that cannot be checked
# from here.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - triple: x86_64-apple-darwin
            runner: macos-latest
          - triple: aarch64-apple-darwin
            runner: macos-latest
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - triple: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}
      # musl needs a linker the GNU-hosted runners do not carry.
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: node scripts/pack-native.mjs --target ${{ matrix.triple }}
        working-directory: packages/compiler

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing, so no long-lived token lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Fails if any of the eight is missing, rather than publishing a
      # `@hozo/compiler` whose optional dependency does not exist -- which
      # installs cleanly and then cannot load on that platform.
      - run: node scripts/check-artifacts.mjs
        working-directory: packages/compiler

      # The nine packages ship compiled JavaScript and declarations, and
      # `dist/` is not in the repository. Publishing without this step
      # produces packages that install cleanly and import nothing.
      # Packages only: the examples' builds want the native addon, and
      # nothing here needs them.
      - run: pnpm turbo run build --filter='./packages/*'

      # Looks inside the tarballs rather than at the manifests describing
      # them: every entry point present, no tests, no addon, a README and
      # a LICENSE in each, and all nine on one version. Runs before
      # `prepare-publish`, which is allowed to rewrite one of them.
      - run: node scripts/check-packages.mjs

      - run: |
          for dir in artifacts/*/; do
            npm publish "$dir" --access public --provenance
          done

      # Writes the optional-dependency list, which is generated rather
      # than committed -- see scripts/prepare-publish.mjs.
      - run: node scripts/prepare-publish.mjs
        working-directory: packages/compiler

      # `pnpm publish`, not `npm publish`: these packages depend on each
      # other through pnpm's `workspace:^` protocol, and only pnpm knows to
      # replace it with the real range on the way out -- npm would upload
      # the literal string. Verified against a real tarball:
      # `"@hozo/compiler": "workspace:^"` leaves as `"^0.1.0"`. `-r` also
      # puts them in dependency order.
      #
      # No `--provenance` flag: `pnpm publish --help` does not list one,
      # and pnpm accepts it without complaint either way, which is the
      # worst of both. Each package carries `publishConfig.provenance`
      # instead, which is declarative and belongs with the package.
      #
      # `--no-git-checks` because `prepare-publish` just modified a file.
      - run: pnpm publish -r --access public --no-git-checks
